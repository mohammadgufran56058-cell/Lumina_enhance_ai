
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina AI Photo Enhancer</title>
    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #101522;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .app {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: #1c2638;
            border-radius: 20px;
        }
        h1 { color: #70e1b5; }
        p { color: #c5code; }
        input[type="file"], label {
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            display: block;
            text-align: left;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        button {
            width: 100%;
            border: 0;
            background: #70e1b5;
            color: #101522;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
        }
        .secondary-btn {
            background: #3b82f6;
            color: white;
            margin-top: 10px;
        }
        .danger-btn {
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }
        .group {
            display: flex;
            gap: 10px;
        }
        .group button {
            width: 50%;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 12px;
            transition: transform 0.2s;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Lumina AI ✨</h1>
        <h2>Photo Enhancer</h2>
        <p>Upload your photo to get started.</p>
        <input type="file" id="photo" accept="image/*">
        <img id="preview" hidden alt="Your photo preview">
        
        <label for="brightness">Brightness</label>
        <input type="range" id="brightness" min="0" max="200" value="100">

        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="0" max="200" value="100">

        <label for="saturation">Saturation</label>
        <input type="range" id="saturation" min="0" max="200" value="100">

        <label for="grayscale">Grayscale</label>
        <input type="range" id="grayscale" min="0" max="100" value="0">

        <label for="blur">Blur</label>
        <input type="range" id="blur" min="0" max="10" value="0">

        <div class="group">
            <button class="secondary-btn" onclick="rotateLeft()">Rotate Left</button>
            <button class="secondary-btn" onclick="rotateRight()">Rotate Right</button>
        </div>

        <div class="group">
            <button class="secondary-btn" onclick="flipHorizontal()">Flip X</button>
            <button class="secondary-btn" onclick="flipVertical()">Flip Y</button>
        </div>

        <button class="danger-btn" onclick="resetAll()">Reset Adjustments</button>
        <button onclick="downloadImage()" style="background: #4ade80; color: #101522;">Download Photo</button>
        <p id="message"></p>
    </div>

    <script>
        const fileInput = document.getElementById('photo');
        const preview = document.getElementById('preview');
        const message = document.getElementById('message');
        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const saturationInput = document.getElementById('saturation');
        const grayscaleInput = document.getElementById('grayscale');
        const blurInput = document.getElementById('blur');

        let rotation = 0;
        let flipX = 1;
        let flipY = 1;

        function showPhoto() {
            const file = fileInput.files[0];
            if (!file) {
                message.textContent = 'Please select a photo first.';
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.hidden = false;
            resetAll();
            message.textContent = 'Photo loaded successfully!';
        }

        function updateStyles() {
            preview.style.filter = `
                brightness(${brightnessInput.value}%) 
                contrast(${contrastInput.value}%) 
                saturate(${saturationInput.value}%)
                grayscale(${grayscaleInput.value}%)
                blur(${blurInput.value}px)
            `;
            preview.style.transform = `rotate(${rotation}deg) scaleX(${flipX}) scaleY(${flipY})`;
        }

        function rotateLeft() {
            rotation -= 90;
            updateStyles();
        }

        function rotateRight() {
            rotation += 90;
            updateStyles();
        }

        function flipHorizontal() {
            flipX *= -1;
            updateStyles();
        }

        function flipVertical() {
            flipY *= -1;
            updateStyles();
        }

        function resetAll() {
            brightnessInput.value = 100;
            contrastInput.value = 100;
            saturationInput.value = 100;
            grayscaleInput.value = 0;
            blurInput.value = 0;
            rotation = 0;
            flipX = 1;
            flipY = 1;
            updateStyles();
        }

        brightnessInput.oninput = updateStyles;
        contrastInput.oninput = updateStyles;
        saturationInput.oninput = updateStyles;
        grayscaleInput.oninput = updateStyles;
        blurInput.oninput = updateStyles;

        fileInput.addEventListener('change', showPhoto);

        function downloadImage() {
            const file = fileInput.files[0];
            if (!file) {
                message.textContent = 'Please upload a photo first to download!';
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.src = preview.src;
            img.onload = function() {
                if (rotation % 180 !== 0) {
                    canvas.width = img.naturalHeight;
                    canvas.height = img.naturalWidth;
                } else {
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                }

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.scale(flipX, flipY);
                ctx.filter = `
                    brightness(${brightnessInput.value}%) 
                    contrast(${contrastInput.value}%) 
                    saturate(${saturationInput.value}%)
                    grayscale(${grayscaleInput.value}%)
                    blur(${blurInput.value}px)
                `;
                
                if (rotation % 180 !== 0) {
                     ctx.drawImage(img, -img.naturalHeight / 2, -img.naturalWidth / 2);
                } else {
                     ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
                }
               
                ctx.restore();

                const link = document.createElement('a');
                link.download = 'enhanced-photo.jpg';
                link.href = canvas.toDataURL('image/jpeg');
                link.click();
            }
        }
    </script>
</body>
</html>
