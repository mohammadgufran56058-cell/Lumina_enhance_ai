<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina AI Photo Enhancer</title>
    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #101522;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .app {
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            background: #1c2638;
            border-radius: 20px;
        }
        h1 { color: #70e1b5; }
        p { color: #c5code; }
        input[type="file"], label {
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            display: block;
            text-align: left;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        button {
            width: 100%;
            border: 0;
            background: #70e1b5;
            color: #101522;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>Lumina AI ✨</h1>
        <h2>Photo Enhancer</h2>
        <p>Upload your photo to get started.</p>
        <input type="file" id="photo" accept="image/*">
        <img id="preview" hidden alt="Your photo preview">
        
        <label for="brightness">Brightness</label>
        <input type="range" id="brightness" min="0" max="200" value="100">

        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="0" max="200" value="100">

        <label for="saturation">Saturation</label>
        <input type="range" id="saturation" min="0" max="200" value="100">

        <button onclick="showPhoto()">Preview Photo</button>
        <button onclick="downloadImage()" style="background: #4ade80;">Download Photo</button>
        <p id="message"></p>
    </div>

    <script>
        const fileInput = document.getElementById('photo');
        const preview = document.getElementById('preview');
        const message = document.getElementById('message');
        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const saturationInput = document.getElementById('saturation');

        function showPhoto() {
            const file = fileInput.files[0];
            if (!file) {
                message.textContent = 'Please select a photo first.';
                return;
            }

            preview.src = URL.createObjectURL(file);
            preview.hidden = false;
            updateFilters();
            message.textContent = 'Photo loaded successfully!';
        }

        function updateFilters() {
            preview.style.filter = `
                brightness(${brightnessInput.value}%) 
                contrast(${contrastInput.value}%) 
                saturate(${saturationInput.value}%)
            `;
        }

        brightnessInput.oninput = updateFilters;
        contrastInput.oninput = updateFilters;
        saturationInput.oninput = updateFilters;

        function downloadImage() {
            const file = fileInput.files[0];
            if (!file) {
                message.textContent = 'Please upload a photo first to download!';
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.src = preview.src;
            img.onload = function() {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;

                // Apply filters on canvas
                ctx.filter = `
                    brightness(${brightnessInput.value}%) 
                    contrast(${contrastInput.value}%) 
                    saturate(${saturationInput.value}%)
                `;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Create download link
                const link = document.createElement('a');
                link.download = 'enhanced-photo.jpg';
                link.href = canvas.toDataURL('image/jpeg');
                link.click();
            }
        }
    </script>
</body>
</html>
